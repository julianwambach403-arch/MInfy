services:
  minfy:
    build: .
    container_name: minfy-server
    restart: unless-stopped
    environment:
      # Anmeldung für Claude Code mit deinem Claude-Abo: Token mit `claude setup-token`
      # erzeugen und in eine .env-Datei neben dieser Datei eintragen:
      #   CLAUDE_CODE_OAUTH_TOKEN=...
      # (Alternativ ANTHROPIC_API_KEY, falls du einen API-Schlüssel hast.)
      # Ohne Anmeldung gibt es einfache Ersatz-Fähigkeiten.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "7777:7777/udp"
    volumes:
      - ./saves:/root/.local/share/godot/app_userdata/MInfy
