services:
  minfy:
    build: .
    container_name: minfy-server
    restart: unless-stopped
    environment:
      # API-Schlüssel für Claude Code (in einer .env-Datei neben dieser Datei eintragen:
      # ANTHROPIC_API_KEY=sk-ant-...). Ohne Schlüssel gibt es einfache Ersatz-Fähigkeiten.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "7777:7777/udp"
    volumes:
      - ./saves:/root/.local/share/godot/app_userdata/MInfy
