[preset.0]

name="Meta Quest 3"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/MInfyManga.apk"

[preset.0.options]

gradle_build/use_gradle_build=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
package/unique_name="com.minfy.mangavr"
package/name="Manga VR"
package/signed=true
screen/immersive_mode=true
xr_features/xr_mode=1
xr_features/enable_meta_plugin=true
meta_xr_features/hand_tracking=1
meta_xr_features/hand_tracking_frequency=1
meta_xr_features/passthrough=1
meta_xr_features/quest_3_support=true
permissions/internet=true
permissions/access_network_state=true
permissions/read_external_storage=true
permissions/manage_external_storage=true
